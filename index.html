<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Photo Ecosystem | Jovi</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="bg-white text-slate-800">

  <header class="max-w-2xl mx-auto flex items-center justify-between px-6 py-4">
    <span class="logo">JOVI</span>
    <span class="wordmark">Photo ecosystem</span>
  </header>

  <main class="max-w-2xl mx-auto pb-10">

    <!-- Carrossel com scroll-snap: arrasta no celular e rola no desktop, sem biblioteca. -->
    <div id="carrossel" class="flex overflow-x-auto snap-x snap-mandatory no-scrollbar scroll-smooth"></div>

    <div id="pontos" class="flex justify-center gap-2 py-6"></div>

    <div class="px-6">
      <a href="pages/feed.html" class="block text-center bg-jovi text-white px-12 py-3 rounded-full text-lg hover:opacity-90">Começar</a>
    </div>

  </main>

  <script>
    const SLIDES = [
      {
        titulo: 'Compartilhe momentos.',
        descricao: 'Suas fotos conectam histórias, lugares e pessoas.',
        imagem: 'assets/img/onboarding/1.jpg',
      },
      {
        titulo: 'Descubra quem está por perto.',
        descricao: 'O mapa mostra usuários Jovi e pontos turísticos ao seu redor.',
        imagem: 'assets/img/onboarding/2.jpg',
      },
      {
        titulo: 'Você no controle.',
        descricao: 'Privacidade, segurança e a opção de não participar, sempre que quiser.',
        imagem: 'assets/img/onboarding/3.jpg',
      },
    ];

    const carrossel = document.getElementById('carrossel');
    const pontos = document.getElementById('pontos');
    let atual = 0;
    let automatico;

    carrossel.innerHTML = SLIDES.map((s) => `
      <section class="snap-center shrink-0 w-full px-6 text-center">
        <h1 class="titulo text-3xl md:text-4xl font-medium mt-6 mb-3">${s.titulo}</h1>
        <p class="text-slate-500 mb-6 min-h-12">${s.descricao}</p>
        <img src="${s.imagem}" alt="${s.titulo}" class="w-full max-w-sm mx-auto rounded-3xl shadow-sm aspect-[4/3] object-cover">
      </section>`).join('');

    function montarPontos() {
      pontos.innerHTML = SLIDES.map((_, i) => `
        <button data-slide="${i}" aria-label="Slide ${i + 1}"
                class="h-2.5 rounded-full transition-all ${i === atual ? 'w-6 bg-jovi' : 'w-2.5 bg-slate-300'}"></button>`).join('');
    }

    function irPara(indice) {
      atual = indice;
      carrossel.scrollTo({ left: carrossel.clientWidth * indice, behavior: 'smooth' });
      montarPontos();
    }

    // O indicador segue o arraste do usuário, não só os cliques.
    carrossel.addEventListener('scroll', () => {
      const indice = Math.round(carrossel.scrollLeft / carrossel.clientWidth);
      if (indice === atual) return;
      atual = indice;
      montarPontos();
    });

    pontos.addEventListener('click', (e) => {
      const ponto = e.target.closest('[data-slide]');
      if (!ponto) return;
      clearInterval(automatico);
      irPara(Number(ponto.dataset.slide));
    });

    // Passa sozinho até a pessoa interagir.
    automatico = setInterval(() => irPara((atual + 1) % SLIDES.length), 5000);
    carrossel.addEventListener('pointerdown', () => clearInterval(automatico));

    montarPontos();
  </script>
</body>
</html>
