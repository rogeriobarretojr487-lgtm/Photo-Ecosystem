<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stories | Photo Ecosystem</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body class="bg-black text-white">

  <main class="relative h-screen overflow-hidden">

    <img id="foto" src="" alt="" class="absolute inset-0 w-full h-full object-cover">

    <!-- Scrims: garantem leitura do texto sobre qualquer foto. -->
    <div class="absolute inset-x-0 top-0 h-40 bg-gradient-to-b from-black/70 to-transparent"></div>
    <div class="absolute inset-x-0 bottom-0 h-40 bg-gradient-to-t from-black/70 to-transparent"></div>

    <!-- Zonas de toque: o avanço é por toque na foto, como num app real. -->
    <button id="anterior" class="absolute left-0 inset-y-0 w-1/3" aria-label="Story anterior"></button>
    <button id="proximo" class="absolute right-0 inset-y-0 w-2/3" aria-label="Próximo story"></button>

    <div class="absolute inset-x-0 top-0 p-3 pointer-events-none">
      <div id="barras" class="flex gap-1"></div>

      <div class="flex items-center gap-3 mt-3">
        <img id="avatar" src="" alt="" class="w-9 h-9 rounded-full object-cover ring-2 ring-white/70">
        <div class="flex-1 min-w-0">
          <p id="autor" class="text-sm font-semibold truncate"></p>
          <p id="meta" class="text-xs text-white/70"></p>
        </div>
        <a href="feed.html" class="pointer-events-auto p-1.5 text-white/90" aria-label="Fechar stories"></a>
      </div>
    </div>

    <div class="absolute inset-x-0 bottom-0 p-4 flex items-center gap-3 pointer-events-none">
      <a href="galeria.html" class="pointer-events-auto flex items-center gap-2 bg-white/15 backdrop-blur rounded-full pl-3 pr-4 py-2 text-sm">
        <span id="icone-galeria"></span> Ver galeria do local
      </a>
      <button id="curtir" class="pointer-events-auto ml-auto w-11 h-11 rounded-full bg-white/15 backdrop-blur flex items-center justify-center" aria-label="Curtir story"></button>
    </div>

  </main>

  <script src="../assets/js/dados.js"></script>
  <script src="../assets/js/app.js"></script>
  <script>
    let atual = 0;
    let timer;

    document.querySelector('[aria-label="Fechar stories"]').innerHTML = icone('fechar');
    document.getElementById('icone-galeria').innerHTML = icone('galeria', 'w-4 h-4');

    function montar() {
      const story = STORIES[atual];
      document.getElementById('avatar').src = story.avatar;
      document.getElementById('autor').textContent = story.autor;
      document.getElementById('meta').textContent = `${story.tempo} • ${story.total} stories`;
      document.getElementById('foto').src = story.foto;
      document.getElementById('foto').alt = `Story em ${story.autor}`;

      const curtir = document.getElementById('curtir');
      curtir.innerHTML = icone('coracao', 'w-6 h-6', story.curtido);
      curtir.classList.toggle('text-rose-500', !!story.curtido);

      document.getElementById('barras').innerHTML = STORIES.map((_, i) => `
        <span class="h-0.5 flex-1 rounded-full ${i <= atual ? 'bg-white' : 'bg-white/35'}"></span>`).join('');
    }

    function ir(passo) {
      atual = (atual + passo + STORIES.length) % STORIES.length;
      montar();
      reiniciarTimer();
    }

    function reiniciarTimer() {
      clearInterval(timer);
      timer = setInterval(() => ir(1), 5000);
    }

    document.getElementById('proximo').addEventListener('click', () => ir(1));
    document.getElementById('anterior').addEventListener('click', () => ir(-1));
    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight') ir(1);
      if (e.key === 'ArrowLeft') ir(-1);
    });

    document.getElementById('curtir').addEventListener('click', () => {
      STORIES[atual].curtido = !STORIES[atual].curtido;
      montar();
    });

    montar();
    reiniciarTimer();
  </script>
</body>
</html>
