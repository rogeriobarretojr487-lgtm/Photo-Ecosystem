<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stories | Photo Ecosystem</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body class="bg-black text-white">

  <main class="max-w-md mx-auto min-h-screen flex flex-col">

    <div id="barras" class="flex gap-1 px-3 pt-3"></div>

    <div class="flex items-center gap-3 px-4 py-3">
      <img id="avatar" src="" alt="" class="w-9 h-9 rounded-full object-cover">
      <div class="flex-1">
        <p id="autor" class="text-sm font-semibold"></p>
        <p id="meta" class="text-xs text-white/60"></p>
      </div>
      <a href="feed.html" class="text-2xl leading-none" aria-label="Fechar">&times;</a>
    </div>

    <div class="relative flex-1">
      <img id="foto" src="" alt="" class="absolute inset-0 w-full h-full object-cover">
      <button id="anterior" class="absolute left-0 inset-y-0 w-1/3 flex items-center justify-start pl-3 text-4xl text-white/80 drop-shadow" aria-label="Story anterior">&laquo;</button>
      <button id="proximo" class="absolute right-0 inset-y-0 w-1/3 flex items-center justify-end pr-3 text-4xl text-white/80 drop-shadow" aria-label="Próximo story">&raquo;</button>
    </div>

    <div class="flex items-center gap-3 px-4 py-4">
      <a href="galeria.html" class="flex-1 bg-white/15 rounded-full px-4 py-2.5 text-sm">Visualizar galeria pública</a>
      <button id="curtir" class="w-11 h-11 rounded-full bg-white/15 text-lg">&#129293;</button>
    </div>

  </main>

  <script src="../assets/js/dados.js"></script>
  <script>
    let atual = 0;
    let timer;

    function montar() {
      const story = STORIES[atual];
      document.getElementById('avatar').src = story.avatar;
      document.getElementById('autor').textContent = story.autor;
      document.getElementById('meta').textContent = `${story.tempo} • ${story.total} stories`;
      document.getElementById('foto').src = story.foto;
      document.getElementById('foto').alt = `Story de ${story.autor}`;
      document.getElementById('curtir').textContent = story.curtido ? '❤️' : '\u{1F90D}';

      document.getElementById('barras').innerHTML = STORIES.map((_, i) => `
        <span class="h-1 flex-1 rounded-full ${i <= atual ? 'bg-white' : 'bg-white/30'}"></span>`).join('');
    }

    function ir(passo) {
      atual = (atual + passo + STORIES.length) % STORIES.length;
      montar();
      reiniciarTimer();
    }

    function reiniciarTimer() {
      clearInterval(timer);
      timer = setInterval(() => ir(1), 5000);
    }

    document.getElementById('proximo').addEventListener('click', () => ir(1));
    document.getElementById('anterior').addEventListener('click', () => ir(-1));
    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight') ir(1);
      if (e.key === 'ArrowLeft') ir(-1);
    });

    document.getElementById('curtir').addEventListener('click', () => {
      STORIES[atual].curtido = !STORIES[atual].curtido;
      montar();
    });

    montar();
    reiniciarTimer();
  </script>
</body>
</html>
