<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Perfil | Photo Ecosystem</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body class="bg-slate-50 text-slate-800 pb-28">

  <header class="sticky top-0 z-10 bg-white border-b">
    <div class="max-w-2xl mx-auto flex items-center justify-between px-5 py-4">
      <a href="../index.html" class="logo">JOVI</a>
      <a href="config.html" id="link-config" class="text-slate-400" aria-label="Configurações"></a>
    </div>
  </header>

  <main class="max-w-2xl mx-auto px-5 py-6">

    <section class="flex items-center gap-4">
      <img id="avatar" src="" alt="" class="w-20 h-20 rounded-full object-cover">
      <div>
        <h1 id="nome" class="text-xl font-bold"></h1>
        <p id="usuario" class="text-slate-500 text-sm"></p>
        <p id="cidade" class="flex items-center gap-1.5 text-slate-400 text-sm"><span></span></p>
      </div>
    </section>

    <section id="stats" class="flex gap-10 py-6"></section>

    <!-- Este é o perfil do próprio usuário (aba Perfil), então aqui não cabe "seguir". -->
    <div class="flex gap-2">
      <a href="config.html" class="flex-1 text-center bg-jovi text-white rounded-full py-2.5 font-medium">Editar perfil</a>
      <button id="compartilhar" class="w-11 h-11 rounded-full border border-slate-200 text-slate-500 flex items-center justify-center" aria-label="Compartilhar perfil"></button>
    </div>

    <section class="pt-8">
      <div class="flex items-baseline justify-between mb-3">
        <h2 class="font-semibold">Locais mais visitados</h2>
        <a href="galeria.html" class="text-sm text-jovi">Ver todos</a>
      </div>
      <div id="locais" class="flex gap-4 overflow-x-auto no-scrollbar pb-2"></div>
    </section>

    <section class="pt-8">
      <div class="flex items-baseline justify-between mb-3">
        <h2 class="font-semibold">Fotos compartilhadas</h2>
        <a href="galeria.html" class="text-sm text-jovi">Ver todos</a>
      </div>
      <div id="fotos" class="grid grid-cols-3 gap-1"></div>
    </section>

  </main>

  <nav id="bottom-nav" class="fixed bottom-0 inset-x-0 bg-white border-t"></nav>

  <script src="../assets/js/dados.js"></script>
  <script src="../assets/js/app.js"></script>
  <script>
    document.getElementById('avatar').src = PERFIL.avatar;
    document.getElementById('avatar').alt = PERFIL.nome;
    document.getElementById('nome').textContent = PERFIL.nome;
    document.getElementById('usuario').textContent = PERFIL.usuario;
    document.getElementById('cidade').innerHTML = `${icone('local', 'w-4 h-4')}<span>${PERFIL.cidade}</span>`;
    document.getElementById('compartilhar').innerHTML = icone('compartilhar');
    document.getElementById('link-config').innerHTML = icone('ajustes', 'w-5 h-5');

    document.getElementById('stats').innerHTML = [
      ['Posts', PERFIL.posts],
      ['Seguindo', PERFIL.seguindo],
      ['Seguidores', PERFIL.seguidores],
    ].map(([rotulo, valor]) => `
      <div>
        <p class="text-xl font-bold">${valor}</p>
        <p class="text-sm text-slate-500">${rotulo}</p>
      </div>`).join('');

    document.getElementById('locais').innerHTML = LOCAIS.slice(0, 4).map((l) => `
      <a href="galeria.html" class="shrink-0 w-24 text-center">
        <img src="${l.foto}" alt="${l.nome}" class="w-24 h-24 rounded-xl object-cover">
        <span class="block text-xs text-slate-500 mt-1">${l.nome}</span>
      </a>`).join('');

    document.getElementById('fotos').innerHTML = GALERIA.fotos.map((f) => `
      <a href="galeria.html"><img src="${f.foto}" alt="Foto em ${GALERIA.local}" class="aspect-square w-full object-cover"></a>`).join('');

  </script>
</body>
</html>
