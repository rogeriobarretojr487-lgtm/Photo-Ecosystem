<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galeria | Photo Ecosystem</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body class="bg-slate-50 text-slate-800 pb-28">

  <header class="sticky top-0 z-10 bg-white border-b">
    <div class="max-w-2xl mx-auto flex items-center justify-between px-5 py-4">
      <a href="../index.html" class="logo">JOVI</a>
      <span class="wordmark">Photo ecosystem</span>
    </div>
  </header>

  <main class="max-w-2xl mx-auto px-5 py-5">

    <section class="flex items-center gap-3">
      <img id="capa" src="" alt="" class="w-14 h-14 rounded-xl object-cover">
      <div>
        <h1 id="local" class="font-semibold"></h1>
        <p id="resumo" class="text-sm text-slate-400"></p>
      </div>
    </section>

    <div id="categorias" class="flex gap-2 overflow-x-auto py-4"></div>

    <section id="fotos" class="grid grid-cols-2 gap-2"></section>

  </main>

  <nav id="bottom-nav" class="fixed bottom-0 inset-x-0 bg-white border-t"></nav>

  <script src="../assets/js/dados.js"></script>
  <script src="../assets/js/app.js"></script>
  <script>
    let categoria = GALERIA.categorias[0];

    document.getElementById('capa').src = GALERIA.capa;
    document.getElementById('capa').alt = GALERIA.local;
    document.getElementById('local').textContent = GALERIA.local;
    document.getElementById('resumo').textContent = `${GALERIA.distancia} • ${GALERIA.fotosHoje} fotos hoje`;

    function montarCategorias() {
      document.getElementById('categorias').innerHTML = GALERIA.categorias.map((c) => `
        <button data-categoria="${c}" class="shrink-0 rounded-full px-4 py-1.5 text-sm border ${
          c === categoria ? 'bg-jovi text-white border-jovi' : 'bg-white text-slate-600 border-slate-200'
        }">${c}</button>`).join('');
    }

    function montarFotos() {
      const lista = GALERIA.fotos.filter((f) => f.categoria === categoria);
      document.getElementById('fotos').innerHTML = lista.length
        ? lista.map((f) => `
          <figure class="relative rounded-xl overflow-hidden">
            <img src="${f.foto}" alt="Foto em ${GALERIA.local}" class="w-full aspect-square object-cover">
            <figcaption class="absolute bottom-0 inset-x-0 flex items-center justify-between px-3 py-2 text-xs text-white bg-black/40">
              <button data-curtir="${f.id}">${f.curtido ? '❤️' : '\u{1F90D}'} Curtir</button>
              <span>${f.curtidas}</span>
            </figcaption>
          </figure>`).join('')
        : '<p class="col-span-2 text-sm text-slate-400 py-6 text-center">Nenhuma foto nesta categoria ainda.</p>';
    }

    document.getElementById('categorias').addEventListener('click', (e) => {
      const botao = e.target.closest('[data-categoria]');
      if (!botao) return;
      categoria = botao.dataset.categoria;
      montarCategorias();
      montarFotos();
    });

    document.getElementById('fotos').addEventListener('click', (e) => {
      const botao = e.target.closest('[data-curtir]');
      if (!botao) return;
      const foto = GALERIA.fotos.find((f) => f.id === Number(botao.dataset.curtir));
      foto.curtido = !foto.curtido;
      foto.curtidas += foto.curtido ? 1 : -1;
      montarFotos();
    });

    montarCategorias();
    montarFotos();
  </script>
</body>
</html>
