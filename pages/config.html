<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Configurações | Photo Ecosystem</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body class="bg-slate-50 text-slate-800 pb-28">

  <header class="sticky top-0 z-10 bg-white border-b">
    <div class="max-w-2xl mx-auto flex items-center justify-between px-5 py-4">
      <a href="../index.html" class="logo">JOVI</a>
      <span class="wordmark">Photo ecosystem</span>
    </div>
  </header>

  <main class="max-w-2xl mx-auto px-5 py-6 space-y-8">

    <section>
      <h1 class="text-xl font-bold mb-1">Privacidade</h1>
      <p class="text-sm text-slate-500 mb-3">Você controla quem vê suas fotos e informações.</p>
      <ul id="toggles" class="bg-white rounded-2xl divide-y"></ul>
    </section>

    <section>
      <h2 class="font-semibold mb-3">Segurança</h2>
      <ul class="bg-white rounded-2xl divide-y">
        <li><a href="#" class="flex items-center justify-between px-4 py-3.5 text-sm">Usuários bloqueados <span class="text-slate-300">&rsaquo;</span></a></li>
        <li><a href="#" class="flex items-center justify-between px-4 py-3.5 text-sm">Denunciar conteúdo <span class="text-slate-300">&rsaquo;</span></a></li>
        <li><a href="#" class="flex items-center justify-between px-4 py-3.5 text-sm">Preferências de conteúdo <span class="text-slate-300">&rsaquo;</span></a></li>
      </ul>
    </section>

    <section>
      <h2 class="font-semibold mb-3">Conta</h2>
      <ul class="bg-white rounded-2xl divide-y">
        <li><a href="perfil.html" class="flex items-center justify-between px-4 py-3.5 text-sm">Editar perfil <span class="text-slate-300">&rsaquo;</span></a></li>
        <li class="flex items-center justify-between px-4 py-3.5 text-sm">
          <label for="idioma">Idioma</label>
          <select id="idioma" class="text-slate-500 bg-transparent outline-none text-right">
            <option>Português</option>
            <option>English</option>
            <option>Español</option>
          </select>
        </li>
        <li><a href="#" class="flex items-center justify-between px-4 py-3.5 text-sm">Ajuda e suporte <span class="text-slate-300">&rsaquo;</span></a></li>
        <li><a href="../index.html" class="block px-4 py-3.5 text-sm text-red-500">Sair da conta</a></li>
      </ul>
    </section>

  </main>

  <nav id="bottom-nav" class="fixed bottom-0 inset-x-0 bg-white border-t"></nav>

  <script src="../assets/js/dados.js"></script>
  <script src="../assets/js/app.js"></script>
  <script>
    const OPCOES = [
      { id: 'conta-privada', titulo: 'Conta privada', descricao: 'Somente seguidores podem ver suas fotos e informações.', padrao: true },
      { id: 'mostrar-local', titulo: 'Mostrar localização', descricao: 'Permitir que outros vejam onde as fotos foram tiradas.', padrao: true },
      { id: 'compartilhar-atividade', titulo: 'Compartilhar atividades', descricao: 'Mostrar suas atividades para seguidores.', padrao: false },
    ];

    // localStorage é JS puro, então continua dentro do escopo da sprint.
    const ligado = (opcao) => localStorage.getItem(opcao.id) === null ? opcao.padrao : localStorage.getItem(opcao.id) === 'true';

    function montar() {
      document.getElementById('toggles').innerHTML = OPCOES.map((o) => `
        <li class="flex items-start gap-4 px-4 py-3.5">
          <div class="flex-1">
            <p class="text-sm font-medium">${o.titulo}</p>
            <p class="text-xs text-slate-400">${o.descricao}</p>
          </div>
          <button data-opcao="${o.id}" role="switch" aria-checked="${ligado(o)}" aria-label="${o.titulo}"
                  class="shrink-0 w-11 h-6 rounded-full p-0.5 ${ligado(o) ? 'bg-jovi' : 'bg-slate-300'}">
            <span class="block w-5 h-5 bg-white rounded-full transition-transform ${ligado(o) ? 'translate-x-5' : ''}"></span>
          </button>
        </li>`).join('');
    }

    document.getElementById('toggles').addEventListener('click', (e) => {
      const botao = e.target.closest('[data-opcao]');
      if (!botao) return;
      const opcao = OPCOES.find((o) => o.id === botao.dataset.opcao);
      localStorage.setItem(opcao.id, String(!ligado(opcao)));
      montar();
    });

    montar();
  </script>
</body>
</html>
